# CI = continuous integration: GitHub runs these checks on every pull request and on
# every push to main. A PR can only be merged when all of them pass.
#
# Supply-chain rules used here:
# - every third-party action is pinned to a full commit SHA (a tag can be moved, a SHA can't);
# - tools are pinned to exact versions (pyproject.toml, gitleaks checksum below);
# - the workflow token is read-only.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button, for re-running by hand

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint (bugs, imports, modern syntax)
        run: ruff check .
      - name: Formatting (fails if any file would be reformatted)
        run: ruff format --check .

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # finish every version, so we see all failures at once
      matrix:
        # 3.11 = oldest supported (Debian 12), 3.12 = Ubuntu 24.04, newer = future distros
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # full history: scan every commit, not just the latest
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan
        env:
          # Extra private patterns (kept out of this public repo), stored as a repo secret.
          # Without it, gitleaks still runs its built-in rules for keys and tokens.
          PRIVATE_RULES: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: |
          cfg=""
          if [ -n "$PRIVATE_RULES" ]; then
            printf '%s\n' "$PRIVATE_RULES" > "$RUNNER_TEMP/rules.toml"
            cfg="--config $RUNNER_TEMP/rules.toml"
          else
            echo "::warning::GITLEAKS_CONFIG_TOML not set: built-in rules only"
          fi
          ./gitleaks git --redact --no-banner $cfg .
